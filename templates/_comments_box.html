<div class="comment-box" id="commentBox">
  <h3 id="commentHeading">💬 Comments</h3>
  <textarea id="commentText" placeholder="Your comment…" maxlength="500"></textarea>
  <input type="text" id="commentName" placeholder="Name *" maxlength="40" required>
  <button type="button" id="commentSubmit">Post comment</button>
  <div class="comment-list" id="commentList"><div class="comment-loading">Loading comments…</div></div>
  <button type="button" class="comment-admin-link" id="commentAdminBtn">Admin</button>
</div>
